{% extends "auth/entrada.html" %}
{% block titulo %}Entrar{% endblock %}
{% block titulo_acesso %}Entrar no SIGMA{% endblock %}
{% block formulario_acesso %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="login">Login</label>
    <input class="form-control" id="login" name="login" value="{{ login }}" autocomplete="username"
      maxlength="40" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="senha">Senha</label>
    <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password"
      maxlength="{{ SENHA_MAXIMA }}" required>
  </div>
  <button type="submit" class="btn btn-primary w-100 mt-2">Entrar</button>
</form>
{% endblock %}
