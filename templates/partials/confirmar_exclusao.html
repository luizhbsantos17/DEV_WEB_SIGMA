<div class="modal fade" id="modalExclusao" tabindex="-1" aria-labelledby="tituloExclusao" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" id="formExclusao">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="tituloExclusao">Confirmar exclusão</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <p>Deseja excluir <strong id="nomeExclusao"></strong>?</p>
          <p class="small text-muted mb-0">
            Se o item já tiver movimentações, ele será inativado em vez de excluído, para preservar o histórico.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Excluir</button>
        </div>
      </form>
    </div>
  </div>
</div>
