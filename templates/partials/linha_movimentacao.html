{% macro linha_item(item, linha) %}
<div class="row g-2 align-items-end mb-2 linha-item">
  <div class="col-12 col-md-7">
    <span class="form-label small mb-1 d-block">Item</span>
    <input type="hidden" name="item_id" value="{{ item.id if item else '' }}">
    <button type="button" class="btn btn-outline-secondary text-start w-100 d-flex align-items-center
      justify-content-between gap-2 selecionar-item" data-bs-toggle="modal" data-bs-target="#seletorItens"
      data-tipo-item="{{ item.tipo if item else '' }}" aria-haspopup="dialog">
      <span class="overflow-hidden">
        <span class="d-block text-truncate nome-item">{{ item.descricao if item else "Selecionar item" }}</span>
        <span class="d-block small saldo-item">{% if item %}Saldo {{ item.quantidade|numero }} {{ item.unidade_medida }}{% endif %}</span>
      </span>
      <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </button>
  </div>
  <div class="col-8 col-md-3">
    <label class="form-label small mb-1">Quantidade</label>
    <input type="text" inputmode="decimal" name="quantidade" class="form-control"
      value="{{ linha.get('quantidade', '') }}" placeholder="0" aria-label="Quantidade">
  </div>
  <div class="col-4 col-md-2">
    <button type="button" class="btn btn-outline-danger w-100 remover-linha" aria-label="Remover item">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>
</div>
{% endmacro %}
